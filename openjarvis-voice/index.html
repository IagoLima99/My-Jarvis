<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis — Conversa por voz</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0d14; color: #e8edf7; }
    main { width: min(680px, calc(100vw - 40px)); padding: 32px; border: 1px solid #273044; border-radius: 20px; background: #121827; box-shadow: 0 24px 70px #0008; }
    h1 { margin: 0 0 8px; font-size: 28px; } p { color: #aeb9cf; line-height: 1.5; }
    #status { margin: 24px 0 12px; min-height: 28px; color: #85b9ff; font-weight: 650; }
    #heard, #reply { min-height: 52px; padding: 14px; margin-top: 10px; border-radius: 12px; background: #0b1120; color: #d6dfef; white-space: pre-wrap; }
    .label { display: block; margin-top: 20px; color: #8491ac; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    button { margin-top: 26px; border: 0; border-radius: 12px; padding: 13px 18px; background: #3d7cff; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button.stop { background: #b74b57; } button:disabled { opacity: .55; cursor: wait; }
    .dot { display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: #56627b; }
    .listening .dot { background: #35d182; box-shadow: 0 0 14px #35d182; }.thinking .dot { background: #ffbd59; }.speaking .dot { background: #8f75ff; }
  </style>
</head>
<body>
  <main>
    <h1>Jarvis por voz</h1>
    <p>Após iniciar uma vez, fale normalmente. O Jarvis detecta a pausa, responde em voz alta e volta a escutar.</p>
    <div id="status"><span class="dot"></span>Pronto para iniciar</div>
    <span class="label">Você disse</span><div id="heard">—</div>
    <span class="label">Jarvis respondeu</span><div id="reply">—</div>
    <button id="toggle">Iniciar conversa</button>
  </main>
  <script>
    const MODEL = 'qwen2.5-coder:14b';
    const SILENCE_MS = 1100;
    const MIN_UTTERANCE_MS = 450;
    const THRESHOLD = 0.025;
    const status = document.querySelector('#status');
    const heard = document.querySelector('#heard');
    const reply = document.querySelector('#reply');
    const toggle = document.querySelector('#toggle');
    let active = false, phase = 'idle', stream, context, analyser, samples, recorder, chunks, lastVoice = 0, startedAt = 0, audio;
    const history = [{ role: 'system', content: 'Você é Jarvis. Responda em português, de forma natural e concisa para uma conversa por voz.' }];

    function setStatus(text, next = 'idle') {
      phase = next;
      status.className = next;
      status.innerHTML = `<span class="dot"></span>${text}`;
    }
    function rms() {
      analyser.getByteTimeDomainData(samples);
      let sum = 0;
      for (const value of samples) { const normal = (value - 128) / 128; sum += normal * normal; }
      return Math.sqrt(sum / samples.length);
    }
    function monitor() {
      if (!active) return;
      if (phase === 'listening') {
        const volume = rms(), now = performance.now();
        if (!recorder && volume >= THRESHOLD) beginUtterance(now);
        if (recorder && volume >= THRESHOLD) lastVoice = now;
        if (recorder && now - lastVoice >= SILENCE_MS && now - startedAt >= MIN_UTTERANCE_MS) recorder.stop();
      }
      requestAnimationFrame(monitor);
    }
    function beginUtterance(now) {
      chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
      recorder.onstop = async () => {
        const clip = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        recorder = null;
        await processUtterance(clip);
      };
      lastVoice = startedAt = now;
      recorder.start();
      setStatus('Ouvindo…', 'listening');
    }
    async function processUtterance(clip) {
      if (!active) return;
      try {
        setStatus('Entendendo…', 'thinking');
        const form = new FormData();
        form.append('file', clip, 'voice.webm');
        const transcription = await fetch('/v1/speech/transcribe', { method: 'POST', body: form });
        if (!transcription.ok) throw new Error('Não foi possível transcrever a fala.');
        const { text } = await transcription.json();
        if (!text?.trim()) { setStatus('Não entendi. Pode repetir?', 'listening'); return; }
        heard.textContent = text;
        history.push({ role: 'user', content: text });
        const chat = await fetch('/v1/chat/completions', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: MODEL, messages: history, stream: false, temperature: 0.7 })
        });
        if (!chat.ok) throw new Error('O Jarvis não respondeu.');
        const payload = await chat.json();
        const textReply = payload.choices?.[0]?.message?.content?.trim();
        if (!textReply) throw new Error('O Jarvis retornou uma resposta vazia.');
        reply.textContent = textReply;
        history.push({ role: 'assistant', content: textReply });
        await speak(textReply);
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Erro na conversa. Tentando escutar novamente.', 'listening');
      }
    }
    async function speak(text) {
      if (!active) return;
      setStatus('Jarvis está falando…', 'speaking');
      const result = await fetch('/v1/speech/synthesize', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      if (!result.ok) throw new Error('Não foi possível gerar a resposta falada.');
      const url = URL.createObjectURL(await result.blob());
      audio = new Audio(url);
      audio.onended = () => { URL.revokeObjectURL(url); if (active) setStatus('Ouvindo…', 'listening'); };
      await audio.play();
    }
    async function start() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
        context = new AudioContext();
        await context.resume();
        analyser = context.createAnalyser(); analyser.fftSize = 2048; samples = new Uint8Array(analyser.fftSize);
        context.createMediaStreamSource(stream).connect(analyser);
        active = true; toggle.textContent = 'Encerrar conversa'; toggle.className = 'stop'; setStatus('Ouvindo…', 'listening'); monitor();
      } catch (error) { setStatus('Permita o microfone para iniciar a conversa.'); console.error(error); }
    }
    function stop() {
      active = false; recorder?.state === 'recording' && recorder.stop(); audio?.pause(); stream?.getTracks().forEach(track => track.stop()); context?.close();
      toggle.textContent = 'Iniciar conversa'; toggle.className = ''; setStatus('Conversa encerrada');
    }
    toggle.addEventListener('click', () => active ? stop() : start());
  </script>
</body>
</html>
